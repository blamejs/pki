name: ClusterFuzzLite PR fuzzing

# Coverage-guided fuzzing via jazzer.js + libFuzzer against every
# fuzz/*.fuzz.js harness on every PR touching lib/ or fuzz/.
#
# We invoke jazzer.js directly instead of routing through the
# google/clusterfuzzlite/actions/build_fuzzers wrapper — the wrapper's
# v1 Docker image refuses to fuzz JavaScript projects (it rejects both a
# real sanitizer and an empty/`none` sanitizer for JS), so it is
# structurally broken for JS as of 2026. The .clusterfuzzlite/ directory
# remains the canonical integration spec — what an OSS-Fuzz upstream
# submission mirrors, what OpenSSF Scorecard's Fuzzing check detects, and
# what would re-engage if CFLite ships a JS fix.
#
# Findings: jazzer's -error_exitcode=1 fails the step with the reproducer
# printed inline; the libFuzzer crash artifact lands at crash-* in the
# workspace and uploads on failure.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ClusterFuzzLite ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - asn1-der
          - cbor-det-parse
          - x509-parse
          - c509-parse
          - composite-kem
          - cms-parse
          - ocsp-parse
          - tsp-parse
          - attrcert-parse
          - crmf-parse
          - pkcs12-parse
          - cmp-parse
          - cmp-support-value
          - cmp-key-package
          - cmc-parse
          - ct-parse
          - ct-verify
          - ct-log-list
          - ct-log-list-sig
          - merkle-verify
          - merkle-produce
          - tlog-parse
          - tlog-proof
          - related-cert
          - alt-sig
          - possession
          - smime-parse
          - smime-verify
          - smime-decrypt
          - pkix-ext-parse
          - extension-table
          - crl-parse
          - csr-parse
          - pkcs8-parse
          - schema-all-parse
          - csrattrs-parse
          - trustanchor-parse
          - est-transfer
          - scep-parse
          - http-digest-challenge
          - jose-parse
          - acme-object
          - trust-certdata
          - guard-json
          - guard-encoding
          - shbs-verify
          - hpke-open
          - sigstore-verify
          - tuf-parse
          - composite-verify
          - inspect-cert
          - inspect-asn1
          - webauthn-parse
          - webauthn-mds
          - lint-certificate
          - lint-csr
          - lint-crl
          - lint-ocsp
          - lint-cms
          - lint-tsp
          - lint-attrcert
          - cms-verify
          - cms-digest
          - dn-string
          - pkcs11-uri
          - pem-bundle
          - pkcs1-parse
          - sec1-parse
          - identity-match
          - ocsp-http-request
          - csr-verify
          - crmf-verify
          - attrcert-verify
          - cms-sign
          - cades-timestamp
          - tsp-sign
          - x509-sign
          - csr-sign
          - attrcert-sign
          - crmf-build
          - crl-sign
          - c509-encode
          - ocsp-verify
          - cms-decrypt
          - cms-decompress
          - tls-cert-decompress
          - key-decrypt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install jazzer.js
        run: npm ci --prefix fuzz

      - name: Fuzz ${{ matrix.target }}
        env:
          # 60s per target on PR. cflite_batch.yml runs the deeper 1800s
          # schedule that surfaces paths this budget can't reach.
          FUZZ_TIME: '60'
        run: |
          set -e
          harness="fuzz/${{ matrix.target }}.fuzz.js"
          corpus="fuzz/${{ matrix.target }}_seed_corpus"
          echo "::group::jazzer fuzz $harness ($FUZZ_TIME s)"
          # `composite-kem` hit `out-of-memory (used: 2093Mb; limit: 2048Mb)` at 458k iterations and
          # `ct-log-list-sig` 2166Mb, both on heads that could not have caused it, and a re-run of an
          # identical commit passed. MEASURED, in this order:
          #   - the verbs themselves retain 0.31 MB per 1000 iterations and then flatten (86 -> 105 MB
          #     over 60k iterations in plain node), so there is no per-iteration retention to remove;
          #   - the same target under jazzer for the same 60 seconds creeps 413 -> 533 MB here against
          #     649 -> 2093 MB in CI, which is the same code and duration for twelve times the growth.
          # What differs is the allocator: glibc keeps freed memory in per-thread arenas, so process
          # RSS climbs monotonically under a high-churn workload that leaks nothing, and
          # -rss_limit_mb measures exactly that. Capping the arenas addresses the growth without
          # touching the limit, which is the one that still finds a parser allocating from an
          # attacker's length field. Raising the limit alone would trade that sensitivity away, so the
          # raise here is small and the cap is doing the work.
          #
          # -malloc_limit_mb is NOT set, and the reason is measured rather than assumed: it is inert
          # under jazzer.js. A target allocating a single 64 MB buffer per iteration ran 200 iterations
          # under -malloc_limit_mb=16 without firing, because libFuzzer's allocator hooks never see a
          # V8 allocation. -rss_limit_mb is the only memory limit that works here.
          export MALLOC_ARENA_MAX=2
          FUZZ_LIMITS="-rss_limit_mb=3072"
          # Pass the seed corpus as the first positional arg when present;
          # libFuzzer treats directory args as corpus inputs.
          if [ -d "$corpus" ]; then
            npx --prefix fuzz jazzer "$harness" "$corpus" -- \
              -max_total_time="$FUZZ_TIME" -error_exitcode=1 -timeout=30 $FUZZ_LIMITS
          else
            npx --prefix fuzz jazzer "$harness" -- \
              -max_total_time="$FUZZ_TIME" -error_exitcode=1 -timeout=30 $FUZZ_LIMITS
          fi
          echo "::endgroup::"

      - name: Upload crash artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore
